<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Admin | Best Vet Clinic</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#17314f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#123b72;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}main{max-width:1100px;margin:35px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e1e9f2;border-radius:16px;padding:24px;box-shadow:0 8px 28px #123b720d}.login{max-width:420px;margin:60px auto}input,button,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #ccd8e6}input{width:100%;margin:10px 0 14px}button{cursor:pointer;background:#1769aa;color:#fff;border:0;font-weight:700}button.secondary{background:#eaf2fb;color:#123b72}button:disabled{opacity:.6}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8eef5;vertical-align:top}th{background:#f5f8fc}td small{color:#657b92}.table-wrap{overflow:auto}.hidden{display:none}.muted{color:#657b92}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.error{color:#b42318}.status{min-width:130px}a{color:#1769aa}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.panel{padding:16px}table{min-width:780px}}
</style></head><body>
<header><strong>🐾 Best Vet Clinic — Admin</strong><a href="/" style="color:white">View website ↗</a></header>
<main>
<section id="login" class="panel login"><h2>Admin login</h2><p class="muted">Sign in to manage appointment requests.</p><form id="loginForm"><label>Admin password</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">Log in</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" class="panel hidden"><div class="toolbar"><div><h2 style="margin:0">Appointment requests</h2><p class="muted">Customer requests are listed newest first.</p></div><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Log out</button></div><div id="summary" class="muted"></div><div class="table-wrap"><table><thead><tr><th>Request</th><th>Customer</th><th>Pet / Service</th><th>Preferred date</th><th>Notes</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script>
const loginBox=document.getElementById('login'),dash=document.getElementById('dashboard'),rows=document.getElementById('rows');
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data}
function show(auth){loginBox.classList.toggle('hidden',auth);dash.classList.toggle('hidden',!auth);if(auth)load()}
async function check(){try{const d=await api('/api/admin/me');show(d.authenticated)}catch{show(false)}}
async function load(){try{const data=await api('/api/admin/appointments');document.getElementById('summary').textContent=data.length+' appointment request(s)';rows.innerHTML='';for(const a of data){const tr=document.createElement('tr');const cells=[`#${a.id}<br><small>${a.created_at}</small>`,`<strong>${esc(a.owner_name)}</strong><br><a href="tel:${esc(a.phone)}">${esc(a.phone)}</a>`,`<strong>${esc(a.pet_type)}</strong><br>${esc(a.service)}`,`${esc(a.preferred_date)}<br><small>${esc(a.preferred_time||'Time not specified')}</small>`,esc(a.message||'—')];for(const c of cells){const td=document.createElement('td');td.innerHTML=c;tr.appendChild(td)}const td=document.createElement('td');const sel=document.createElement('select');sel.className='status';['New','Contacted','Confirmed','Completed','Cancelled'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=v===a.status;sel.appendChild(o)});sel.addEventListener('change',async()=>{try{await api('/api/admin/appointments/'+a.id,{method:'PATCH',body:JSON.stringify({status:sel.value})})}catch(e){alert(e.message)}});td.appendChild(sel);tr.appendChild(td);rows.appendChild(tr)}}catch(e){alert(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('loginError');error.textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('password').value='';show(true)}catch(err){error.textContent=err.message}});
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});show(false)};check();
</script></body></html>
