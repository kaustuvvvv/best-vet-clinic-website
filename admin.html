<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Admin</title>
<style>
body{margin:0;background:#f2f6f3;color:#20312b;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:40px auto;padding:0 18px}h1{color:#174c3c}.panel{background:white;padding:22px;border-radius:14px;box-shadow:0 8px 24px #173f3310;margin:18px 0}input,select{padding:10px;border:1px solid #ccd8d0;border-radius:7px;font:inherit}button{background:#174c3c;color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7ede9;vertical-align:top;font-size:14px}th{color:#174c3c}small{color:#66766f}.tablewrap{overflow-x:auto}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#message{font-weight:bold}
</style></head><body><div class="wrap"><div class="top"><div><h1>Best Vet Clinic · Admin</h1><small>Private appointment management</small></div><a href="/" style="color:#174c3c">View website</a></div>
<div class="panel" id="loginPanel"><h2>Admin sign in</h2><p>Only authorized clinic staff should use this page.</p><form id="loginForm"><input type="password" id="password" placeholder="Admin password" required autocomplete="current-password"> <button>Sign in</button></form><p id="loginMessage"></p></div>
<div class="panel hidden" id="dashboard"><div class="top"><h2>Appointment requests</h2><div><button id="refresh">Refresh</button> <button id="logout">Sign out</button></div></div><p id="message"></p><div class="tablewrap"><table><thead><tr><th>Request</th><th>Owner & contact</th><th>Pet / service</th><th>Preferred time</th><th>Notes</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function showAdmin(on){$("loginPanel").classList.toggle("hidden",on);$("dashboard").classList.toggle("hidden",!on)}
async function load(){try{const items=await api("/api/admin/appointments");$("rows").innerHTML="";if(!items.length){$("rows").innerHTML='<tr><td colspan="6">No appointment requests yet.</td></tr>';return}for(const a of items){const tr=document.createElement("tr");const cells=[`#${a.id}<br><small>${a.created_at}</small>`,`${esc(a.owner_name)}<br><a href="tel:${encodeURIComponent(a.phone)}">${esc(a.phone)}</a>`,`${esc(a.pet_type)}<br>${esc(a.service)}`,`${esc(a.preferred_date||"Not specified")}<br>${esc(a.preferred_time||"Not specified")}`,esc(a.notes||"—")];cells.forEach((v)=>{const td=document.createElement("td");td.innerHTML=v;tr.appendChild(td)});const td=document.createElement("td");const s=document.createElement("select");["New","Contacted","Confirmed","Completed","Cancelled"].forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;o.selected=x===a.status;s.appendChild(o)});s.addEventListener("change",async()=>{try{await api(`/api/admin/appointments/${a.id}`,{method:"PATCH",body:JSON.stringify({status:s.value})});$("message").textContent="Status updated."}catch(e){$("message").textContent=e.message}});td.appendChild(s);tr.appendChild(td);$("rows").appendChild(tr)}}catch(e){$("message").textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMessage").textContent="Signing in…";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});$("password").value="";showAdmin(true);load()}catch(err){$("loginMessage").textContent=err.message}});
$("refresh").onclick=load;$("logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});showAdmin(false)};
api("/api/admin/session").then(s=>{if(s.authenticated){showAdmin(true);load()}});
</script></body></html>
